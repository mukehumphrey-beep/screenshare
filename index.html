<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Screen Share — PC</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #0b0d10;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .home {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .home h1 { font-size: 32px; margin-bottom: 8px; }
  .unit-title { color: #4f8cff; font-size: 14px; font-weight: 700; letter-spacing: 3px; text-align: center; }
  .unit-motto { color: #8a8f98; font-size: 12px; letter-spacing: 1.5px; text-align: center; margin-bottom: 28px; }
  .home p { color: #8a8f98; margin-bottom: 32px; }
  .field { width: 320px; margin-bottom: 20px; }
  .field label {
    display: block;
    color: #8a8f98;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }
  .field input {
    width: 100%;
    background: #15181d;
    border: 1px solid #23262c;
    border-radius: 10px;
    padding: 14px;
    color: #fff;
    font-size: 16px;
    text-transform: uppercase;
  }
  .field input:focus { outline: none; border-color: #4f8cff; }
  button {
    cursor: pointer;
    border: none;
    font-size: 15px;
    font-weight: 600;
  }
  .btn {
    width: 320px;
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 12px;
    color: #fff;
  }
  .btn-primary { background: #4f8cff; }
  .btn-secondary { background: #15181d; border: 1px solid #23262c !important; }
  .btn-primary:disabled, .btn-secondary:disabled { opacity: 0.4; cursor: not-allowed; }

  .session { display: none; flex: 1; flex-direction: column; }
  .session.active { display: flex; }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid #15181d;
  }
  .room-badge {
    background: rgba(21,24,29,0.85);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .leave-btn {
    background: rgba(21,24,29,0.85);
    color: #fff;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
  }
  .status-text { color: #8a8f98; font-size: 14px; padding: 0 24px; margin-top: 8px; }

  .video-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    position: relative;
    min-height: 0;
  }
  video { max-width: 100%; max-height: 100%; }
  .placeholder { color: #8a8f98; font-size: 16px; text-align: center; padding: 24px; }
  .placeholder.warn { color: #ff5c5c; }

  .viewer-list { padding: 12px 24px; }
  .viewer-list h3 { font-size: 13px; color: #8a8f98; margin: 8px 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .viewer-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: #ff5c5c; }
  .dot.connected { background: #3ddc84; }
  .dot.connecting { background: #f5c518; }

  .log-panel { border-top: 1px solid #23262c; background: rgba(21,24,29,0.95); flex-shrink: 0; }
  .log-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    cursor: pointer;
  }
  .log-header span.title { color: #8a8f98; font-size: 12px; font-weight: 600; }
  .log-header .buttons { display: flex; gap: 8px; }
  .log-header button {
    background: #23262c;
    color: #fff;
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 11px;
  }
  .log-body {
    display: none;
    max-height: 220px;
    overflow-y: auto;
    padding: 0 16px 12px;
  }
  .log-body.expanded { display: block; }
  .log-line { color: #7fd88a; font-size: 11px; font-family: monospace; margin-bottom: 3px; }
  .log-empty { color: #4a4d53; font-size: 11px; }
</style>
</head>
<body>

<div class="home" id="home">
  <div class="unit-title">81 UAV REGIMENT</div>
  <div class="unit-motto">Observe. Strike. Defend.</div>
  <h1>Screen Share — PC</h1>
  <p>Broadcast this screen, or watch someone else's — works with the phone app too.</p>

  <div class="field">
    <label>Room code</label>
    <input id="roomCodeInput" placeholder="Leave blank to create a new room" maxlength="10" />
  </div>

  <button class="btn btn-primary" id="broadcastBtn">Start Broadcasting</button>
  <button class="btn btn-secondary" id="viewBtn">Join as Viewer</button>
</div>

<div class="session" id="session">
  <div class="top-bar">
    <div class="room-badge" id="roomBadge">Room ------</div>
    <div style="display:flex; gap: 8px;">
      <button class="leave-btn" id="fullscreenBtn">⛶ Fullscreen</button>
      <button class="leave-btn" id="leaveBtn">Leave</button>
    </div>
  </div>
  <div class="status-text" id="statusText"></div>

  <div class="video-area" id="videoArea">
    <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
    <div class="placeholder" id="placeholder">Connecting…</div>
  </div>

  <div class="viewer-list" id="viewerList" style="display:none;">
    <h3>Viewers (<span id="viewerCount">0</span>)</h3>
    <div id="viewerRows"></div>
  </div>

  <div class="log-panel">
    <div class="log-header" id="logHeader">
      <span class="title" id="logTitle">▶ Debug log (0)</span>
      <div class="buttons">
        <button id="copyLogBtn">Copy</button>
        <button id="clearLogBtn">Clear</button>
      </div>
    </div>
    <div class="log-body" id="logBody">
      <div class="log-empty" id="logEmpty">No log entries yet.</div>
    </div>
  </div>
</div>

<script>
// ---------- Config (matches the mobile app's setup) ----------
const BROKER_URL = 'wss://broker.emqx.io:8084/mqtt';

const ICE_SERVERS = [
  { urls: 'stun:stun.l.google.com:19302' },
  {
    urls: 'turn:free.expressturn.com:3478',
    username: '000000002102840832',
    credential: 'c0PBgan6ln1CtqnQNbedNJni7V8=',
  },
  {
    urls: 'turn:free.expressturn.com:3478?transport=tcp',
    username: '000000002102840832',
    credential: 'c0PBgan6ln1CtqnQNbedNJni7V8=',
  },
];

function topicFor(roomCode) {
  return `claude-screenshare/v1/${roomCode}/signal`;
}
function randomId(prefix) {
  return `${prefix}-${Math.random().toString(36).slice(2, 10)}`;
}
function randomRoomCode() {
  return Math.random().toString(36).slice(2, 8).toUpperCase();
}

// ---------- Logging ----------
const logLines = [];
function log(...args) {
  const msg = args.map(a => typeof a === 'string' ? a : JSON.stringify(a)).join(' ');
  const d = new Date();
  const pad = n => n.toString().padStart(2, '0');
  const ts = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${d.getMilliseconds().toString().padStart(3,'0')}`;
  const line = `[${ts}] ${msg}`;
  logLines.push(line);
  if (logLines.length > 200) logLines.shift();
  console.log(msg);
  renderLog();
}
function renderLog() {
  const body = document.getElementById('logBody');
  const title = document.getElementById('logTitle');
  const expanded = body.classList.contains('expanded');
  title.textContent = `${expanded ? '▼' : '▶'} Debug log (${logLines.length})`;
  body.innerHTML = logLines.length
    ? logLines.map(l => `<div class="log-line">${l.replace(/</g,'&lt;')}</div>`).join('')
    : '<div class="log-empty">No log entries yet.</div>';
  body.scrollTop = body.scrollHeight;
}
document.getElementById('logHeader').addEventListener('click', (e) => {
  if (e.target.tagName === 'BUTTON') return;
  document.getElementById('logBody').classList.toggle('expanded');
  renderLog();
});
document.getElementById('copyLogBtn').addEventListener('click', async () => {
  await navigator.clipboard.writeText(logLines.join('\n'));
  const btn = document.getElementById('copyLogBtn');
  const old = btn.textContent;
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = old, 1200);
});
document.getElementById('clearLogBtn').addEventListener('click', () => {
  logLines.length = 0;
  renderLog();
});

// ---------- Signaling ----------
function connectSignaling(roomCode, myId, { onConnect, onMessage, onError }) {
  const client = mqtt.connect(BROKER_URL, { clientId: myId, clean: true, reconnectPeriod: 2000 });
  const topic = topicFor(roomCode);

  client.on('connect', () => {
    client.subscribe(topic, { qos: 0 }, (err) => {
      if (err) { onError?.(err); return; }
      onConnect?.();
    });
  });
  client.on('message', (_t, payload) => {
    try {
      const msg = JSON.parse(payload.toString());
      if (msg.from === myId) return;
      if (msg.to && msg.to !== myId) return;
      onMessage?.(msg);
    } catch (e) { onError?.(e); }
  });
  client.on('error', (err) => onError?.(err));

  return {
    send: (message) => client.publish(topic, JSON.stringify({ ...message, from: myId }), { qos: 0 }),
    disconnect: () => client.end(true),
  };
}

// ---------- WebRTC helpers ----------
function candidateType(str) {
  const m = /typ (\w+)/.exec(str || '');
  return m ? m[1] : 'unknown';
}
function createPeerConnection({ peerId, signalSend, onRemoteStream, onStateChange }) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS, iceCandidatePoolSize: 10 });

  pc.addEventListener('icecandidate', (event) => {
    if (event.candidate) {
      log(`Local ICE candidate [${peerId}]: type=${candidateType(event.candidate.candidate)}`);
      signalSend({ type: 'ice-candidate', to: peerId, candidate: event.candidate });
    }
  });
  pc.addEventListener('iceconnectionstatechange', () => {
    log(`ICE connection [${peerId}]: ${pc.iceConnectionState}`);
  });
  pc.addEventListener('connectionstatechange', () => {
    onStateChange?.(pc.connectionState);
  });
  if (onRemoteStream) {
    pc.addEventListener('track', (event) => {
      if (event.streams && event.streams[0]) onRemoteStream(event.streams[0]);
    });
  }
  return pc;
}
async function createOffer(pc, localStream) {
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  return pc.localDescription;
}
async function createAnswer(pc, remoteOffer) {
  await pc.setRemoteDescription(new RTCSessionDescription(remoteOffer));
  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  return pc.localDescription;
}
async function acceptAnswer(pc, remoteAnswer) {
  await pc.setRemoteDescription(new RTCSessionDescription(remoteAnswer));
}
async function addRemoteIceCandidate(pc, candidate) {
  try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); }
  catch (e) { log('Failed to add ICE candidate:', e.message); }
}

// ---------- UI wiring ----------
const homeEl = document.getElementById('home');
const sessionEl = document.getElementById('session');
const roomBadge = document.getElementById('roomBadge');
const statusText = document.getElementById('statusText');
const placeholder = document.getElementById('placeholder');
const remoteVideo = document.getElementById('remoteVideo');
const viewerListEl = document.getElementById('viewerList');
const viewerRowsEl = document.getElementById('viewerRows');
const viewerCountEl = document.getElementById('viewerCount');

let signaling = null;
let localStream = null;
const peers = {}; // peerId -> RTCPeerConnection
let myId = null;
let currentRole = null;

function showSession(roomCode) {
  homeEl.style.display = 'none';
  sessionEl.classList.add('active');
  roomBadge.textContent = `Room ${roomCode}`;
}
function setStatus(text, warn) {
  statusText.textContent = text;
  placeholder.textContent = text;
  placeholder.className = 'placeholder' + (warn ? ' warn' : '');
}
function cleanup() {
  signaling?.disconnect();
  Object.values(peers).forEach(pc => pc.close());
  Object.keys(peers).forEach(k => delete peers[k]);
  localStream?.getTracks().forEach(t => t.stop());
  localStream = null;
  remoteVideo.style.display = 'none';
  remoteVideo.srcObject = null;
  placeholder.style.display = 'block';
}

document.getElementById('leaveBtn').addEventListener('click', () => {
  cleanup();
  sessionEl.classList.remove('active');
  homeEl.style.display = 'flex';
  viewerListEl.style.display = 'none';
  if (document.fullscreenElement) document.exitFullscreen();
});

// ---- Fullscreen ----
const fullscreenBtn = document.getElementById('fullscreenBtn');
const videoAreaEl = document.getElementById('videoArea');
fullscreenBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    videoAreaEl.requestFullscreen().catch((err) => log('Fullscreen request failed:', err.message));
  } else {
    document.exitFullscreen();
  }
});
document.addEventListener('fullscreenchange', () => {
  fullscreenBtn.textContent = document.fullscreenElement ? '⛶ Exit Fullscreen' : '⛶ Fullscreen';
});

// ---- Broadcaster ----
async function startBroadcasting(roomCode) {
  myId = randomId('broadcaster-pc');
  currentRole = 'broadcaster';
  showSession(roomCode);
  viewerListEl.style.display = 'block';
  setStatus('Requesting screen capture…');

  try {
    log('Requesting getDisplayMedia()...');
    localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    const videoTracks = localStream.getVideoTracks();
    log(`getDisplayMedia resolved — tracks=${localStream.getTracks().length} video=${videoTracks.length} ` +
      videoTracks.map(t => `[state=${t.readyState} enabled=${t.enabled}]`).join(' '));
    setStatus('Broadcasting — share the room code with viewers');

    // If the user stops sharing via the browser's own "Stop sharing" UI.
    videoTracks[0].addEventListener('ended', () => {
      log('Screen share ended by browser UI');
      document.getElementById('leaveBtn').click();
    });

    signaling = connectSignaling(roomCode, myId, {
      onConnect: () => log(`Signaling connected as ${myId} in room ${roomCode}`),
      onMessage: async (msg) => {
        if (msg.type === 'join') {
          if (peers[msg.from]) return;
          log(`Viewer joined: ${msg.from}`);
          const pc = createPeerConnection({
            peerId: msg.from,
            signalSend: signaling.send,
            onStateChange: (state) => {
              log(`Viewer ${msg.from} state -> ${state}`);
              updateViewerRow(msg.from, state);
              if (['failed','closed','disconnected'].includes(state)) delete peers[msg.from];
            },
          });
          peers[msg.from] = pc;
          const offer = await createOffer(pc, localStream);
          log(`Sent offer to ${msg.from}`);
          signaling.send({ type: 'offer', to: msg.from, sdp: offer });
        } else if (msg.type === 'answer') {
          const pc = peers[msg.from];
          if (pc) { await acceptAnswer(pc, msg.sdp); log(`Accepted answer from ${msg.from}`); }
        } else if (msg.type === 'ice-candidate') {
          const pc = peers[msg.from];
          if (pc) await addRemoteIceCandidate(pc, msg.candidate);
        }
      },
      onError: (err) => log('Signaling error:', err.message || String(err)),
    });
  } catch (err) {
    log('getDisplayMedia FAILED:', err.message);
    setStatus(`Could not start screen capture: ${err.message}`, true);
  }
}
function updateViewerRow(id, state) {
  let row = document.getElementById('vr-' + id);
  if (!row) {
    row = document.createElement('div');
    row.className = 'viewer-row';
    row.id = 'vr-' + id;
    row.innerHTML = `<div class="dot" id="dot-${id}"></div><span>${id}</span><span id="state-${id}" style="margin-left:auto;color:#8a8f98;"></span>`;
    viewerRowsEl.appendChild(row);
  }
  document.getElementById('dot-' + id).className = 'dot' + (state === 'connected' ? ' connected' : (['connecting','new'].includes(state) ? ' connecting' : ''));
  document.getElementById('state-' + id).textContent = state;
  viewerCountEl.textContent = Object.keys(peers).length;
}

// ---- Viewer ----
function startViewing(roomCode) {
  myId = randomId('viewer-pc');
  currentRole = 'viewer';
  showSession(roomCode);
  setStatus('Looking for broadcaster…');
  log(`Joining room ${roomCode} as ${myId}`);

  let found = false;
  const notFoundTimer = setTimeout(() => {
    if (!found) {
      setStatus(`No broadcaster found for room ${roomCode}`, true);
      log(`No broadcaster found after 15s in room ${roomCode}`);
    }
  }, 15000);

  signaling = connectSignaling(roomCode, myId, {
    onConnect: () => {
      log('Signaling connected, sending join');
      setStatus(`Joined room ${roomCode} — waiting for broadcast…`);
      signaling.send({ type: 'join' });
    },
    onMessage: async (msg) => {
      if (msg.type === 'offer') {
        log(`Offer received from ${msg.from}`);
        found = true;
        clearTimeout(notFoundTimer);
        const pc = createPeerConnection({
          peerId: msg.from,
          signalSend: signaling.send,
          onRemoteStream: (stream) => {
            const videoTracks = stream.getVideoTracks();
            log(`Remote stream received — tracks=${stream.getTracks().length} video=${videoTracks.length} ` +
              videoTracks.map(t => `[state=${t.readyState} enabled=${t.enabled}]`).join(' '));
            remoteVideo.srcObject = stream;
            remoteVideo.style.display = 'block';
            placeholder.style.display = 'none';
            setStatus('Live');
          },
          onStateChange: (state) => {
            log(`Peer connection state -> ${state}`);
            if (['failed','disconnected','closed'].includes(state)) {
              setStatus(`Connection lost — waiting to reconnect to room ${roomCode}…`, true);
              remoteVideo.style.display = 'none';
              placeholder.style.display = 'block';
            }
          },
        });
        peers[msg.from] = pc;
        const answer = await createAnswer(pc, msg.sdp);
        log('Sending answer');
        signaling.send({ type: 'answer', to: msg.from, sdp: answer });
      } else if (msg.type === 'ice-candidate') {
        const pc = peers[msg.from];
        if (pc) await addRemoteIceCandidate(pc, msg.candidate);
      }
    },
    onError: (err) => log('Signaling error:', err.message || String(err)),
  });
}

// ---- Home screen buttons ----
document.getElementById('broadcastBtn').addEventListener('click', () => {
  const code = document.getElementById('roomCodeInput').value.trim().toUpperCase() || randomRoomCode();
  startBroadcasting(code);
});
document.getElementById('viewBtn').addEventListener('click', () => {
  const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
  if (!code) { alert('Enter a room code to join, or leave blank and use "Start Broadcasting" to create one.'); return; }
  startViewing(code);
});
</script>
</body>
</html>
